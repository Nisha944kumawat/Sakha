<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title -->
    <title>Sakha App</title>

    <!-- SEO Meta Tags -->
    <meta
      name="title"
      content="Sakha App - Premium Restaurant & Dining Experience"
    />

    <meta
      name="description"
      content="Sakha App offers a premium restaurant and dining experience with authentic flavors, elegant ambiance, and seamless online booking services."
    />

    <meta
      name="keywords"
      content="Sakha App, restaurant, dining, food, premium restaurant, online booking, Indian cuisine, luxury dining"
    />

    <meta name="author" content="Sakha App" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#000000" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/src/assets/favicon.png"
    />

    <!-- Apple Touch Icon -->
    <link
      rel="apple-touch-icon"
      href="/src/assets/favicon.png"
    />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="Sakha App - Premium Restaurant & Dining Experience"
    />

    <meta
      property="og:description"
      content="Experience authentic flavors, elegant ambiance, and premium dining with Sakha App."
    />

    <meta
      property="og:image"
      content="/src/assets/favicon.png"
    />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
